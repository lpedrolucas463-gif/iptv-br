<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV BR - Área do Cliente</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080808;
    color:#fff;
    min-height:100vh;
}

.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:380px;
    background:#151515;
    padding:30px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

.logo{
    font-size:32px;
    font-weight:bold;
    margin-bottom:10px;
}

.logo span{
    color:#00e676;
}

.login-box p{
    color:#aaa;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #333;
    border-radius:10px;
    background:#0d0d0d;
    color:#fff;
    outline:none;
    font-size:16px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.login-btn{
    width:100%;
    background:#00e676;
    color:#000;
}

.error{
    color:#ff5252;
    margin-top:12px;
    display:none;
}

.app{
    display:none;
    min-height:100vh;
}

header{
    background:#111;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #292929;
}

.logout{
    background:#ff5252;
    color:#fff;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 18px;
}

.welcome{
    margin-bottom:20px;
}

.welcome h1{
    font-size:26px;
    margin-bottom:8px;
}

.welcome p{
    color:#aaa;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:15px;
    padding:20px;
}

.card small{
    color:#999;
}

.card strong{
    display:block;
    font-size:20px;
    margin-top:8px;
}

.panel{
