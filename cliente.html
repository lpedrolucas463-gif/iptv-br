
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV BR - Área do Cliente</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080808;
    color:white;
    min-height:100vh;
}

.login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:380px;
    background:#151515;
    padding:30px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 0 30px rgba(255,255,255,.08);
}

.logo{
    font-size:32px;
    font-weight:bold;
    margin-bottom:10px;
}

.logo span{
    color:#00e676;
}

.login-box p{
    color:#aaa;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #333;
    border-radius:10px;
    background:#0d0d0d;
    color:white;
    outline:none;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    cursor:pointer;
    font-weight:bold;
}

.login-btn{
    width:100%;
    background:#00e676;
    color:#000;
}

.error{
    color:#ff5252;
    margin-top:12px;
    display:none;
}

.app{
    display:none;
    min-height:100vh;
}

header{
    background:#111;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #292929;
}

.logout{
    background:#ff5252;
    color:white;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 18px;
}

.welcome{
    margin-bottom:20px;
}

.welcome h1{
    font-size:26px;
    margin-bottom:8px;
}

.welcome p{
    color:#aaa;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:#151515;
    border:1px solid #292929;
    border-radius:15px;
    padding:20px;
}

.card small{
    color:#999;
}

.card strong{
    display:block;
    font-size:20px;
    margin-top:8px;
}

.panel{
    background:#151515;
    border:1px solid #292929;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.panel h2{
    margin-bottom:15px;
}

.info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.info div{
    background:#0e0e0e;
    padding:14px;
    border-radius:10px;
}

.info span{
    display:block;
    color:#888;
    font-size:13px;
    margin-bottom:5px;
}

.player{
    width:100%;
    background:#000;
    border-radius:12px;
    overflow:hidden;
}

video{
    width:100%;
    max-height:500px;
    display:block;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

.whatsapp{
    background:#25d366;
    color:white;
}

.refresh{
    background:#333;
    color:white;
}

@media(max-width:700px){
    .cards{
        grid-template-columns:1fr;
    }

    .info{
        grid-template-columns:1fr;
    }

    header{
        padding:15px;
    }

    .container{
        padding:18px 12px;
    }
}
</style>
</head>

<body>

<div class="login" id="login">
    <div class="login-box">
        <div class="logo">IPTV <span>BR</span></div>
        <p>Área exclusiva do cliente</p>

        <input id="username" type="text" placeholder="Usuário">
        <input id="password" type="password" placeholder="Senha">

        <button class="login-btn" onclick="login()">
            Entrar
        </button>

        <div class="error" id="error">
            Usuário ou senha incorretos.
        </div>
    </div>
</div>

<div class="app" id="app">

<header>
    <div class="logo">IPTV <span>BR</span></div>

    <button class="logout" onclick="logout()">
        Sair
    </button>
</header>

<div class="container">

    <div class="welcome">
        <h1>Olá, <span id="clientName">Cliente</span> 👋</h1>
        <p>Bem-vindo à sua área de cliente.</p>
    </div>

    <div
