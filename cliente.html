<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV BR - Cliente</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#080808;
  color:white;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:380px;
  background:#171717;
  padding:30px;
  border-radius:18px;
  text-align:center;
}

h1{
  margin-top:0;
}

.green{
  color:#00e676;
}

input{
  width:100%;
  padding:15px;
  margin:8px 0;
  border:1px solid #333;
  border-radius:10px;
  background:#0b0b0b;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#00e676;
  color:#000;
  font-size:16px;
  font-weight:bold;
}

.erro{
  color:#ff5252;
  margin-top:15px;
  display:none;
}

#cliente{
  display:none;
  min-height:100vh;
}

.topo{
  background:#151515;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sair{
  width:auto;
  background:#ff5252;
  color:white;
  padding:10px 16px;
  margin:0;
}

.conteudo{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#171717;
  border:1px solid #292929;
  border-radius:15px;
  padding:20px;
  margin-bottom:18px;
}

.card p{
  color:#aaa;
}

video{
  width:100%;
  background:#000;
  border-radius:12px;
}

.suporte{
  background:#25d366;
  color:white;
}

</style>
</head>

<body>

<!-- LOGIN -->

<div class="login" id="login">

  <div class="box">

    <h1>
      IPTV <span class="green">BR</span>
    </h1>

    <p>Área do Cliente</p>

    <input
      id="usuario"
      type="text"
      placeholder="Usuário"
    >

    <input
      id="senha"
      type="password"
      placeholder="Senha"
    >

    <button type="button" onclick="entrar()">
      ENTRAR
    </button>

    <div class="erro" id="erro">
      Usuário ou senha incorretos.
    </div>

  </div>

</div>


<!-- ÁREA DO CLIENTE -->

<div id="cliente">

  <div class="topo">

    <strong>
      IPTV <span class="green">BR</span>
    </strong>

    <button
      class="sair"
      type="button"
      onclick="sair()"
    >
      Sair
    </button>

  </div>


  <div class="conteudo">

    <div class="card">

      <h2>
        Olá, Cliente! 👋
      </h2>

      <p>
        Bem-vindo à sua área de cliente.
      </p>

    </div>


    <div class="card">

      <h2>📋 Minha conta</h2>

      <p>
        <strong>Usuário:</strong> cliente
      </p>

      <p>
        <strong>Plano:</strong> Premium
      </p>

      <p>
        <strong>Vencimento:</strong> 30/12/2026
      </p>

      <p>
        <strong>Status:</strong> Ativo ✅
      </p>

    </div>


    <div class="card">

      <h2>📺 Assistir</h2>

      <video
        id="video"
        controls
        playsinline
      ></video>

      <button
        type="button"
        onclick="abrirVideo()"
      >
        ▶ TESTAR VÍDEO
      </button>

    </div>


    <div class="card">

      <h2>💬 Suporte</h2>

      <p>
        Entre em contato com o suporte.
      </p>

      <button
        class="suporte"
        type="button"
        onclick="suporte()"
      >
        WhatsApp
      </button>

    </div>

  </div>

</div>


<script>

function entrar(){

  var usuario =
    document.getElementById("usuario").value.trim();

  var senha =
    document.getElementById("senha").value.trim();

  var erro =
    document.getElementById("erro");

  if(
    usuario === "cliente" &&
    senha === "1234"
  ){

    document.getElementById("login").style.display = "none";

    document.getElementById("cliente").style.display = "block";

    erro.style.display = "none";

  }else{

    erro.style.display = "block";

  }

}


function sair(){

  document.getElementById("cliente").style.display = "none";

  document.getElementById("login").style.display = "flex";

  document.getElementById("usuario").value = "";

  document.getElementById("senha").value = "";

}


function abrirVideo(){

  var video =
    document.getElementById("video");

  video.src =
    "https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4";

  video.load();

  video.play().catch(function(){

    alert("Toque no botão ▶ do vídeo.");

  });

}


function suporte(){

  alert(
    "O WhatsApp do suporte será configurado depois."
  );

}

</script>

</body>
</html>
