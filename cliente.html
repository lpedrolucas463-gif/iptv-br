<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV BR - Cliente</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f19;
    color: white;
}

#login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.caixa {
    width: 90%;
    max-width: 350px;
    background: #151b29;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    box-sizing: border-box;
    border: 0;
    border-radius: 8px;
    background: #252d3d;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

#erro {
    color: #ff5555;
    margin-top: 15px;
}

#area {
    display: none;
}

header {
    background: #151b29;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.sair {
    width: auto;
    margin: 0;
    background: #dc2626;
    padding: 8px 15px;
}

.conteudo {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.info {
    background: #151b29;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 20px;
}

video {
    width: 100%;
    background: black;
    border-radius: 10px;
}

.categorias {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin: 20px 0;
}

.categorias button {
    width: auto;
    white-space: nowrap;
    background: #252d3d;
}

.canais {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 15px;
}

.canal {
    background: #151b29;
    padding: 15px;
    border-radius: 12px;
}

.canal button {
    width: 100%;
}

.favorito {
    background: #374151;
}
</style>
</head>

<body>

<div id="login">

    <div class="caixa">

        <h1>📺 IPTV BR</h1>
        <p>Área do Cliente</p>

        <input
            id="usuario"
            type="text"
            placeholder="Usuário"
        >

        <input
            id="senha"
            type="password"
            placeholder="Senha"
        >

        <button id="botaoEntrar" type="button">
            ENTRAR
        </button>

        <div id="erro"></div>

    </div>

</div>


<div id="area">

    <header>
        <strong>📺 IPTV BR</strong>

        <button class="sair" id="botaoSair" type="button">
            Sair
        </button>
    </header>

    <div class="conteudo">

        <div class="info">
            <h2>👋 Bem-vindo!</h2>
            <p><strong>Plano:</strong> Premium</p>
            <p><strong>Validade:</strong> 30/12/2026</p>
            <p><strong>Status:</strong> 🟢 Ativo</p>
        </div>

        <h2 id="titulo">▶️ Selecione um canal</h2>

        <video id="player" controls playsinline></video>

        <div class="categorias">

            <button type="button" onclick="mostrar('Todos')">
                ⭐ Todos
            </button>

            <button type="button" onclick="mostrar('TV Aberta')">
                📺 TV Aberta
            </button>

            <button type="button" onclick="mostrar('Filmes')">
                🎬 Filmes
            </button>

            <button type="button" onclick="mostrar('Séries')">
                📺 Séries
            </button>

            <button type="button" onclick="mostrar('Esportes')">
                ⚽ Esportes
            </button>

            <button type="button" onclick="mostrar('Notícias')">
                📰 Notícias
            </button>

            <button type="button" onclick="mostrar('Música')">
                🎵 Música
            </button>

            <button type="button" onclick="mostrar('Infantil')">
                👶 Infantil
            </button>

            <button type="button" onclick="mostrar('Todos')">
                ❤️ Favoritos
            </button>

        </div>

        <div id="canais" class="canais"></div>

    </div>

</div>


<script>

var videoDemo =
"https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4";


var canais = [

    ["TV Demonstração", "TV Aberta", "📺"],
    ["Notícias Demonstração", "Notícias", "📰"],
    ["Filme Demonstração", "Filmes", "🎬"],
    ["Série Demonstração", "Séries", "📺"],
    ["Esporte Demonstração", "Esportes", "⚽"],
    ["Música Demonstração", "Música", "🎵"],
    ["Infantil Demonstração", "Infantil", "👶"],
    ["Documentário Demonstração", "Documentários", "🌎"],
    ["Entretenimento Demonstração", "Entretenimento", "🎭"],
    ["Games Demonstração", "Games", "🎮"]

];


document.getElementById("botaoEntrar").onclick = function() {

    var usuario =
        document.getElementById("usuario").value.trim();

    var senha =
        document.getElementById("senha").value.trim();

    if (usuario === "cliente" && senha === "1234") {

        document.getElementById("login").style.display = "none";

        document.getElementById("area").style.display = "block";

        document.getElementById("erro").innerHTML = "";

        mostrar("Todos");

    } else {

        document.getElementById("erro").innerHTML =
            "❌ Usuário ou senha incorretos.";

    }

};


document.getElementById("senha").onkeydown = function(event) {

    if (event.key === "Enter") {

        document.getElementById("botaoEntrar").click();

    }

};


document.getElementById("botaoSair").onclick = function() {

    document.getElementById("area").style.display = "none";

    document.getElementById("login").style.display = "flex";

    document.getElementById("usuario").value = "";

    document.getElementById("senha").value = "";

};


function mostrar(categoria) {

    var area =
        document.getElementById("canais");

    area.innerHTML = "";

    for (var i = 0; i < canais.length; i++) {

        if (
            categoria === "Todos" ||
            canais[i][1] === categoria
        ) {

            var card =
                document.createElement("div");

            card.className = "canal";

            card.innerHTML =
                "<div style='font-size:40px'>" +
                canais[i][2] +
                "</div>" +

                "<h3>" +
                canais[i][0] +
                "</h3>" +

                "<p>" +
                canais[i][1] +
                "</p>" +

                "<button type='button' onclick='assistir(" +
                i +
                ")'>▶️ Assistir</button>" +

                "<button type='button' class='favorito'>" +
                "❤️ Favoritar</button>";

            area.appendChild(card);

        }

    }

}


function assistir(numero) {

    document.getElementById("titulo").innerHTML =
        "▶️ " + canais[numero][0];

    var player =
        document.getElementById("player");

    player.src = videoDemo;

    player.load();

    player.play().catch(function() {});

    window.scrollTo(0, 0);

}

</script>

</body>
</html>
