<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV BR - Cliente</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
}

.login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:380px;
    background:#171717;
    padding:30px;
    border-radius:18px;
    text-align:center;
}

.logo{
    font-size:30px;
    font-weight:bold;
}

.green{
    color:#00e676;
}

.login-box p{
    color:#aaa;
}

input{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:1px solid #333;
    border-radius:10px;
    background:#0b0b0b;
    color:#fff;
    font-size:16px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 18px;
    cursor:pointer;
    font-weight:bold;
}

.login-btn{
    width:100%;
    margin-top:10px;
    background:#00e676;
    color:#000;
}

.erro{
    display:none;
    color:#ff5252;
    margin-top:15px;
}

#cliente{
    display:none;
    min-height:100vh;
}

.topo{
    background:#151515;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #292929;
    position:sticky;
    top:0;
    z-index:10;
}

.sair{
    background:#ff5252;
    color:#fff;
}

.conteudo{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:#171717;
    border:1px solid #292929;
    border-radius:15px;
    padding:18px;
    margin-bottom:18px;
}

.card p{
    color:#aaa;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.card strong{
    font-size:20px;
}

.player-box{
    background:#171717;
    border:1px solid #292929;
    border-radius:15px;
    padding:18px;
    margin-bottom:20px;
}

video{
    width:100%;
    background:#000;
    border-radius:12px;
    display:block;
    min-height:220px;
}

#nomeCanal{
    margin-top:12px;
    font-size:19px;
    font-weight:bold;
}

.busca{
    margin-bottom:15px;
}

.categorias{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:15px;
}

.categorias button{
    white-space:nowrap;
    background:#292929;
    color:#fff;
}

.categorias button.ativo{
    background:#00e676;
    color:#000;
}

.lista-canais{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.canal{
    background:#101010;
    border:1px solid #292929;
    border-radius:14px;
    padding:15px;
}

.icone{
    font-size:30px;
    margin-bottom:8px;
}

.canal h3{
    margin:5px 0;
}

.canal p{
    color:#888;
    font-size:13px;
    min-height:30px;
}

.acoes{
    display:flex;
    gap:8px;
}

.assistir{
    flex:1;
    background:#00e676;
    color:#000;
}

.favorito{
    background:#292929;
    color:#fff;
}

.favorito.ativo{
    background:#ffd54f;
    color:#000;
}

.suporte{
    width:100%;
    background:#25d366;
    color:#fff;
}

.vazio{
    color:#888;
    text-align:center;
    padding:30px;
}

@media(max-width:700px){

    .cards{
        grid-template-columns:1fr;
    }

    .lista-canais{
        grid-template-columns:1fr;
    }

    .conteudo{
        padding:14px;
    }

}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login" id="login">

    <div class="login-box">

        <div class="logo">
            IPTV <span class="green">BR</span>
        </div>

        <p>Área exclusiva do cliente</p>

        <input
            id="usuario"
            type="text"
            placeholder="Usuário"
        >

        <input
            id="senha"
            type="password"
            placeholder="Senha"
        >

        <button
            class="login-btn"
            type="button"
            onclick="entrar()"
        >
            ENTRAR
        </button>

        <div class="erro" id="erro">
            Usuário ou senha incorretos.
        </div>

    </div>

</div>


<!-- CLIENTE -->

<div id="cliente">

    <div class="topo">

        <div class="logo">
            IPTV <span class="green">BR</span>
        </div>

        <button
            class="sair"
            onclick="sair()"
        >
            Sair
        </button>

    </div>


    <div class="conteudo">

        <div class="card">

            <h2>
                Olá, Cliente! 👋
            </h2>

            <p>
                Escolha seu conteúdo para assistir.
            </p>

        </div>


        <!-- INFORMAÇÕES -->

        <div class="cards">

            <div class="card">
                <small>Plano</small>
                <strong>Premium</strong>
            </div>

            <div class="card">
                <small>Vencimento</small>
                <strong>30/12/2026</strong>
            </div>

            <div class="card">
                <small>Status</small>
                <strong>Ativo ✅</strong>
            </div>

        </div>


        <!-- PLAYER -->

        <div class="player-box">

            <h2>📺 Player</h2>

            <video
                id="video"
                controls
                playsinline
            ></video>

            <div id="nomeCanal">
                Nenhum conteúdo selecionado
            </div>

        </div>


        <!-- CANAIS -->

        <div class="player-box">

            <h2>📡 Canais</h2>


            <!-- BUSCA -->

            <input
                class="busca"
                id="busca"
                type="text"
                placeholder="🔎 Procurar canal..."
                oninput="buscar()"
            >


            <!-- CATEGORIAS -->

            <div class="categorias">

                <button
                    class="ativo"
                    onclick="filtrar('todos',this)"
                >
                    ⭐ Todos
                </button>

                <button
                    onclick="filtrar('tv',this)"
                >
                    📺 TV Aberta
                </button>

                <button
                    onclick="filtrar('noticias',this)"
                >
                    📰 Notícias
                </button>

                <button
                    onclick="filtrar('filmes',this)"
                >
                    🎬 Filmes
                </button>

                <button
                    onclick="filtrar('series',this)"
                >
                    📺 Séries
                </button>

                <button
                    onclick="filtrar('esportes',this)"
                >
                    ⚽ Esportes
                </button>

                <button
                    onclick="filtrar('musica',this)"
                >
                    🎵 Música
                </button>

                <button
                    onclick="filtrar('infantil',this)"
                >
                    👶 Infantil
                </button>

                <button
                    onclick="filtrar('documentarios',this)"
                >
                    🌎 Documentários
                </button>

                <button
                    onclick="filtrar('entretenimento',this)"
                >
                    🎭 Entretenimento
                </button>

                <button
                    onclick="filtrar('games',this)"
                >
                    🎮 Games
                </button>

                <button
                    onclick="filtrar('ao-vivo',this)"
                >
                    🔴 Ao Vivo
                </button>

                <button
                    onclick="filtrar('favoritos',this)"
                >
                    ❤️ Favoritos
                </button>

            </div>


            <div
                class="lista-canais"
                id="listaCanais"
            ></div>

        </div>


        <!-- SUPORTE -->

        <div class="card">

            <h2>💬 Suporte</h2>

            <p>
                Precisa de ajuda?
            </p>

            <button
                class="suporte"
                onclick="suporte()"
            >
                Falar com suporte
            </button>

        </div>

    </div>

</div>


<script>

/* LOGIN */

function entrar(){

    const usuario =
        document.getElementById("usuario").value.trim();

    const senha =
        document.getElementById("senha").value.trim();

    const erro =
        document.getElementById("erro");


    if(
        usuario === "cliente" &&
        senha === "1234"
    ){

        document.getElementById("login")
            .style.display = "none";

        document.getElementById("cliente")
            .style.display = "block";

        erro.style.display = "none";

        carregarCanais();

    }else{

        erro.style.display = "block";

    }

}
