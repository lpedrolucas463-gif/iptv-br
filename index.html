<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV BR</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #1d1d1d;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .logo span {
      color: #e50914;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #e50914;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .dashboard {
      display: none;
      padding: 30px 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .header button {
      width: auto;
      padding: 10px 18px;
      margin: 0;
    }

    .plans {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .plan {
      background: #1d1d1d;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .clients {
      background: #1d1d1d;
      padding: 20px;
      border-radius: 12px;
    }

    .client {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #333;
    }

    .client button {
      width: auto;
      background: #555;
      padding: 7px 12px;
      margin: 0;
    }

    .error {
      color: #ff4444;
      margin-top: 10px;
    }

    .success {
      color: #4caf50;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div id="loginPage" class="login-page">
    <div class="login-box">

      <div class="logo">
        IPTV <span>BR</span>
      </div>

      <h2>Entrar</h2>

      <input type="text" id="username
