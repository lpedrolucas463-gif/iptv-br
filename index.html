<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IPTV BR - Painel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#080b11;
    color:#fff;
}

.hidden{
    display:none!important;
}

/* LOGIN */

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at top,#202838,#080b11 60%);
}

.login-box{
    width:92%;
    max-width:390px;
    background:#121824;
    border:1px solid #293344;
    border-radius:20px;
    padding:35px 25px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.login-logo img{
    width:180px;
    max-width:80%;
    margin-bottom:20px;
}

.login-box h2{
    margin-bottom:20px;
}

.login-box input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border-radius:10px;
    border:1px solid #303b4d;
    background:#0d131e;
    color:#fff;
    outline:none;
}

.login-button{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#e50914;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.error{
    color:#ff5964;
    margin-top:12px;
}

/* APP */

.app{
    min-height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:245px;
    background:#101620;
    border-right:1px solid #222b39;
    min-height:100vh;
    position:fixed;
    left:0;
    top:0;
    padding:22px 15px;
    z-index:10;
}

.brand{
    text-align:center;
    padding-bottom:25px;
    border-bottom:1px solid #252e3a;
    margin-bottom:20px;
}

.brand img{
    width:150px;
    max-width:90%;
}

.menu-title{
    color:#68758a;
    font-size:11px;
    font-weight:bold;
    margin:18px 10px 8px;
    text-transform:uppercase;
}

.menu button{
    width:100%;
    text-align:left;
    padding:13px;
    margin:4px 0;
    background:transparent;
    color:#aeb8c8;
    border:0;
    border-radius:9px;
    cursor:pointer;
    font-size:14px;
}

.menu button:hover,
.menu button.active{
    background:#1d2634;
    color:#fff;
}

.menu button.active{
    border-left:3px solid #e50914;
}

.logout{
    position:absolute;
    bottom:20px;
    left:15px;
    right:15px;
}

.logout button{
    width:100%;
    padding:12px;
    border:1px solid #3b2630;
    border-radius:9px;
    background:#1a1217;
    color:#ff6873;
    cursor:pointer;
}

/* MAIN */

.main{
    margin-left:245px;
    width:calc(100% - 245px);
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
}

.topbar h1{
    font-size:25px;
}

.topbar p{
    color:#78869a;
    font-size:13px;
    margin-top:5px;
}

.admin{
    background:#151d29;
    border:1px solid #273243;
    border-radius:10px;
    padding:10px 14px;
    color:#c6ceda;
}

/* SECTIONS */

.section{
    display:none;
}

.section.active{
    display:block;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat{
    background:#121824;
    border:1px solid #222c3b;
    border-radius:14px;
    padding:20px;
}

.stat-icon{
    font-size:24px;
    margin-bottom:12px;
}

.stat-title{
    color:#7d899a;
    font-size:13px;
}

.stat-number{
    font-size:27px;
    font-weight:bold
